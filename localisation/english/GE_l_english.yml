 col_roz_YS_planet: "§RKey of the Door§!"
 col_roz_YS_planet_desc: "Compared to the Veil Planet, this dense purple atmosphere offers no barrier—ships can come and go freely. Beneath the skies lies a thriving world teeming with life, its surface ecosystem resembling that of Gaia planet. Puzzlingly, it is scattered with countless fully operational structures of civilizations past. Prolonged stays here bring whispers of the unknown, a relentless test on the minds of its inhabitants."
