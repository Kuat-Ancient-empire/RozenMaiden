 #event chains

 roz_void_energy_research_chain_title: "§BOrigin of Void Technology§!"
 roz_void_energy_research_chain_desc: "The enigmatic pinpoint glow born from experiments on that spatial gate has unveiled its unparalleled value to us, while simultaneously exposing colossal risks. Ultimately, we resolved to proceed with researching this luminous anomaly despite the peril. Concurrently, we must enhance safeguards for research facilities within N-Gebiet to brace for potential contingencies."

 roz_outland_system_chain_title: "§PFallen Celestial Realm§!"
 roz_outland_system_chain_desc: "That temporal rift has led us here, yet this murky galaxy exists beyond the fabric of reality. Gazing into its depths reveals only an abyssal void, while faint murmurs echo through every mind—whispers akin to the death-rattle of the dying..."
 outland_systen_counter: "Clue"

 roz_shuukan_shoujonotsukurikata_project_chain_title: "The Art of Creating a Girl"
 roz_shuukan_shoujonotsukurikata_project_chain_desc: "A mysterious parcel of unknown origin arrived, and upon opening it, I found components of a Rozen Maiden doll. How could a storyline straight out of a manga materialize in reality? Yet, as Suigintou declared, the Gate of Causality has swung open for [Root.GetRulerName]. Though its source and motive remain shrouded in mystery, Mystery Weekly has indeed chosen [Root.GetRulerName] as its recipient. One day, the fifth doll—Shinku's body—shall be restored to wholeness by [Root.GetRulerName]'s hands.\n"§MWatching you toil over assembling those doll components… memories flood back vividly.§!""
