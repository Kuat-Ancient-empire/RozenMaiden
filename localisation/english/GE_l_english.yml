 council_agenda_agenda_void_core_boost_name:0 "§BEnergy Release§!"
 council_agenda_agenda_void_core_boost_desc:0 "In this golden age, energy surplus has surprisingly become a significant challenge. Thus, implementing periodic energy releases stands as an efficient and logical solution. These vast amounts of inexpensive energy will be fully allocated to space forces and colonies across the galaxy. Many sociologists have warned that this approach fosters wasteful habits of energy consumption—should we ever §Rlose this limitless energy source§!, our entire civilization could §Rcollapse instantly§!..."



