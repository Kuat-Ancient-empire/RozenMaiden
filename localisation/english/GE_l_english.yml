 r_roz_extrinsic_xinlin_crystal_unknow: "§BExotic Xiling Crystal§!"
 r_roz_extrinsic_xinlin_crystal_unknow_desc: "A coffin-like crystal – the unanimous description by all researchers after visual inspection... With exceptionally high structural integrity, we've failed to find any method to even scratch its surface... §YData stored within the crystal remains in the process of analysis.§!"

 r_roz_extrinsic_xinlin_crystal: "§BOver-Limit Capacitance Crystal - Type 12345§!"
 r_roz_extrinsic_xinlin_crystal_desc: "This mysterious and potent crystal gifted by the Xiling Civilization serves as the Prime Controller for reversing Theo-contamination and reshaping the Rosa Mystica. Though now embedded within the Dataforge at the Perished Pantheon star cluster, it remains functionally autonomous. Suigintou has trolled this naming convention repeatedly, yet our scientists insist on preserving its original designation."

 r_roz_extrinsic_xinlin_crystal_broken: "§gDamaged Over-Limit Capacitance Crystal§!"
 r_roz_extrinsic_xinlin_crystal_broken_desc: "The original Over-Limit Capacitance Crystal-Type 12345, damaged through overload due to intensive deployment in Project Shinku Awakening, has lost most structural functions. Yet as a technological artifact of a super-civilization, this crystal still provides valuable insights to our researchers."

