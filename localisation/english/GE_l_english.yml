 GetRozDamageDiffTextA1: "§W"I have full confidence in your courage, sense of duty, and combat prowess. Your path leads only to overwhelming victory! Good luck out there!"§!\n\n§BThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextA2: "§W"You shall become an unstoppable force!"§!\n\n§BThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextA3: "§W"With every press of the boost button, your gameplay stress fades—yet the void within grows deeper..."§!\n\n§BThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextA4: "§W"What manner of foe has you so thoroughly spooked?", Unite Fleet？High-rate Crisis？Eternal Fleet? The Third Expedition Fleet? The engraving evil shadow? Starborn? §EShroud Invader§!? ……§!\n\n§BThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextB1: "§W"Though our foe crashes upon us like a raging tide—victory may not come swift, but we shall fight on through every loss, unyielding to the last."§!\n\n§RThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextB2: "§W\"Three centuries later, as you sink into the armchair with its polyether polyurethane foam cushions, your grandson leaning against your mechanical leg asks: 'What did you do during the great §!§YWar in Heaven§!§W?' You won’t have to clear your throat and mutter: 'Well now... your grandpa was scrapping on Necromunda.'\"§!\n\n§RThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextB3: "§W\"I have nothing to offer but blood, toil, tears and sweat.\"§!\n\n§RThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!"
 GetRozDamageDiffTextB4: "§W"Really still nerfing? Then we can't beat anyone at all!"\n\n§RThe current §HDamage§! Multiplier is: [This.ge_buff_count]%§!, under this modifier, Void weapons will barely reach base stats or even drop below.§!"
