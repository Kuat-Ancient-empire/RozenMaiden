 ##relics

 r_roz_stasis_field: "§MVoid Shield Generator§!"
 r_roz_stasis_field_desc: "A relic of the forgotten past. After its previous explosion, Engineering can only restore the components responsible for the stasis field—the camouflage/cloaking systems remain nonfunctional for now."
 r_roz_doll_Annabelle:"§PAnnabelle§!"
 r_roz_doll_Annabelle_desc:"Meme：§RInauspicious§!"

 #Beacon of Space-Time
 r_roz_Chronos_Label:"§CSignpost of Space-Time§!"
 r_roz_Chronos_Label_desc:"A spiraling mistmass, dense in hand, bound to Kirakishou by soul-link. Even sealed, it warps spacetime into folds; when activated, it triggers Class IV temporal distortion with ease.\n§C--Once a guide through the endless cosmos, now corrupted by the abyss's taint—this shattered yet pure fragment of divine authority may be their last untouched sanctuary§!……\n§RNote：Enable $r_roz_Chronos_Label$ will slightly disrupt the continuity of spacetime, and we will be unable to obtain accurate time for a period.§!"
 r_roz_Chronos_Label_active_effect_tt:"\nCreate a $chronos_storm$ in the selected system. The spacetime distortion accompanying the storm will §Rkill§! 15% of the population£pop£ in the affected colonial settlements, inflict §Ratastrophic damage§! on planetary production and livelihoods, and randomly destroy a valueless planet within the system into a $pc_broken$.\n "
 r_roz_Chronos_Label_effect:"Within one year of activation, the $r_roz_Chronos_Label$ will enable all ships to bypass Hyperlane jump capability. \nUpon activation during wartime, it will release spacetime turbulence toward all engaged enemy fleets, forcing them into §Remergency FTL§!."

 r_roz_teaparty_set: "§YTea Party utensils§!"
 r_roz_teaparty_set_desc: "Suigintou's meticulously crafted alchemical artifacts, replicated from memories of distant courtyard days. Though she never willingly reveals their purpose, these items are invariably filled with pastries and black tea during each doll's tea party, placed upon the table with precision."
 r_roz_teaparty_set_ct: "\n§BYou can change the tea party time from here.§! \n \n"
 r_roz_teaparty_set_possible: "§RYou have entered the settings menu!§!"

 r_roz_orgel: "§MSuigintou's Orgel§!"
 r_roz_orgel_desc: "This delicate music box was once Suigintou's most treasured possession—the first gift her father, Rozen, ever gave her. It was a miraculous alchemical artifact capable of soothing emotions even without playing a single note, calming those who heard its silent resonance."

 #shinku
 roz_shuukan_shoujonotsukurikata_vol1:"Weekly——The Art of Creating a Girl Vol.1"
 roz_shuukan_shoujonotsukurikata_vol1_desc:"A mysterious publication detailing the creation of Rozen Maiden, accompanied by a few crafting tools and a brass-colored key-wound mechanism. The so-called 「['concept_roz_rozen_maiden']」 were seven dolls created by the renowned dollmaster ['concept_roz_rozen'], with extremely scarce records of their appearance on the market—so much so that their very existence is now doubted. According to those rare records, the production years of this series were widely dispersed, with some separated by centuries. Could this truly shinku. "

 roz_shuukan_shoujonotsukurikata_vol2:"Weekly——The Art of Creating a Girl Vol.2"
 roz_shuukan_shoujonotsukurikata_vol2_desc:"An unidentified publication detailing the creation methods of Rozen Maiden was found, accompanied by a set of crafting tools and a ornate ['concept_roz_kaban'] adorned with golden roses—its design strikingly similar to Suigintou container. Inside lay a pair of doll leg parts, engraved with the word "Rozen". \n\"The second appendix includes a storage box for completed dolls—along with thigh components. What all Rozen Maiden dolls share in common is their signature engraved on the inner thigh, with handwriting analysis suggesting it came from the same person. Using the parts provided in each issue, you'll create a Rozen Maiden exclusively your own. §RThis issue presents the fifth doll—Shinku§!.\""

 roz_shuukan_shoujonotsukurikata_vol3:"Weekly——The Art of Creating a Girl Vol.3"
 roz_shuukan_shoujonotsukurikata_vol3_desc:"An unidentified special edition publication meticulously detailed the process of attaching eyeballs to doll's eyes. It came with a set of crafting tools and new doll components—a lower leg part and right foot."

 roz_shuukan_shoujonotsukurikata_vol4:"Weekly——The Art of Creating a Girl Vol.4"
 roz_shuukan_shoujonotsukurikata_vol4_desc:"An unidentified special issue publication comprehensively cataloged the functions and usage methods of various doll-making tools. Accompanying the guide were select crafting tools and new doll components—an upper arm piece."
 roz_shuukan_shoujonotsukurikata_vol5:"Weekly——The Art of Creating a Girl Vol.5"
 roz_shuukan_shoujonotsukurikata_vol5_desc:"An unidentified special issue publication demonstrated how to use cosmetics to dress up dolls. It came with a selection of crafting tools and new doll components—a forearm piece."
 roz_shuukan_shoujonotsukurikata_vol6:"Weekly——The Art of Creating a Girl Vol.6"
 roz_shuukan_shoujonotsukurikata_vol6_desc:"An unidentified special issue publication focused on textile craftsmanship, specifically teaching lace fabric production and application techniques. The guide included a selection of crafting tools and new doll components—a pair of hands."
 roz_shuukan_shoujonotsukurikata_vol7:"Weekly——The Art of Creating a Girl Vol.7"
 roz_shuukan_shoujonotsukurikata_vol7_desc:"An unidentified publication detailing the creation methods of Rozen Maiden was found, accompanied by a set of crafting tools and new doll components—a pair of glass eyes."
 roz_shuukan_shoujonotsukurikata_vol8:"Weekly——The Art of Creating a Girl Vol.8"
 roz_shuukan_shoujonotsukurikata_vol8_desc:"An unidentified publication documenting the creation methods of Rozen Maiden was discovered, containing a selection of crafting tools along with new doll components—a complete torso assembly."
 roz_shuukan_shoujonotsukurikata_vol9:"Weekly——The Art of Creating a Girl Vol.9"
 roz_shuukan_shoujonotsukurikata_vol9_desc:"An unidentified publication containing instructions for creating Rozen Maiden dolls was found, accompanied by a set of crafting tools and doll components."
 roz_shuukan_shoujonotsukurikata_vol10:"Weekly——The Art of Creating a Girl Vol.10"
 roz_shuukan_shoujonotsukurikata_vol10_desc:"An unidentified publication containing alchemical knowledge—appearing to be a postscript—was discovered?"

 roz_shinku's_body_assembly_stage_1: "Doll Body of Shinku(Incomplete)"
 roz_shinku's_body_assembly_stage_1_desc: "Unfinished Doll, though traces of polished surfaces on its parts still testify to the craftsmanship of its maker."
 roz_shinku's_body_assembly_stage_1_ct: "§RThe Doll is Incomplete.§!"
 roz_shinku's_body_assembly_stage_2: "Shinku's Doll Body (Near-Completion)"
 roz_shinku's_body_assembly_stage_2_desc: "A Mostly Completed Doll, leaving much to the imagination about its final form."
 roz_shinku's_body_assembly_stage_2_ct: "§RThe Doll is Incomplete.§!"
 roz_shinku's_body_assembly_stage_3: "Shinku in Slumber"
 roz_shinku's_body_assembly_stage_3_desc: "You have recreated the perfect form of the Fifth Rozen Maiden Doll—save for its lifelessness…"
 roz_shinku's_body_assembly_stage_3_ct: "§RNeeds the true $sr_rosa_mystica$§!"
